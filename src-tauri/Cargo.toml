[package]
name = "hyperfamily-branch-monitor"
version = "3.0.0"
description = "Secure Windows desktop monitoring and inventory application for HyperFamily retail branches"
authors = ["Ali Ajeli Lahiji"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync", "fs"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
ssh2 = "0.9"
reqwest = { version = "0.12", default-features = true, features = ["json", "stream"] }
openssl = { version = "0.10", features = ["vendored"] }
bcrypt = "0.15"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
umya-spreadsheet = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
subtle = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_SystemServices"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
